# Actualiza catalogo.html, las paginas de producto (carpeta productos/) y sitemap.xml
# cada vez que cambia productos.js o fichas.js.
# Funciona solo: al anadir un recurso a la landing, GitHub lo ejecuta y guarda el resultado.
name: Actualizar catalogo y sitemap

on:
  push:
    branches: [main]
    paths:
      - 'productos.js'
      - 'fichas.js'
      - 'scripts/generar-catalogo.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la version mas reciente del repositorio
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Generar catalogo, paginas de producto y sitemap
        run: node scripts/generar-catalogo.js

      - name: Guardar cambios si los hay
        run: |
          if [ -z "$(git status --porcelain -- catalogo.html sitemap.xml productos)" ]; then
            echo "Nada que actualizar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalogo.html sitemap.xml productos
          git commit -m "Catalogo, paginas de producto y sitemap actualizados automaticamente"
          git pull --rebase origin main
          git push origin HEAD:main
