# Actualiza catalogo.html y sitemap.xml cada vez que cambia productos.js.
# Funciona solo: al anadir un recurso a la landing, GitHub lo ejecuta y guarda el resultado.
name: Actualizar catalogo y sitemap

on:
  push:
    branches: [main]
    paths:
      - 'productos.js'
      - 'scripts/generar-catalogo.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Generar catalogo y sitemap
        run: node scripts/generar-catalogo.js

      - name: Guardar cambios si los hay
        run: |
          if git diff --quiet -- catalogo.html sitemap.xml && [ -z "$(git ls-files --others --exclude-standard catalogo.html sitemap.xml)" ]; then
            echo "Nada que actualizar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.html sitemap.xml
          git commit -m "Catalogo y sitemap actualizados automaticamente"
          git pull --rebase origin main
          git push origin HEAD:main
